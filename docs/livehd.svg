<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  LiveHD overall flow (hand-written SVG, units are mm).

  Inputs (green)  -> readers (blue) -> LNAST (upass: one sweep) -> LGraph (pass loop)
  -> writers (blue) -> outputs (green).  Yosys goes straight to LGraph; slang and
  Pyrope go through LNAST.  Pyrope is emitted from LNAST, Verilog / sim from LGraph.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="150mm" height="30mm" viewBox="0 0 150 30" version="1.1">
  <defs>
    <marker id="arrow" orient="auto" refX="0" refY="0" style="overflow:visible">
      <path d="M 8.7185878,4.0337352 -2.2072895,0.01601326 8.7185884,-4.0017078 c -1.7454984,2.3720609 -1.7354408,5.6174519 -6e-7,8.035443 z"
            transform="scale(-0.6)"
            fill="#ffcc00" stroke="#ffcc00" stroke-width="0.625" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- boxes and IR sheets -->
  <g fill="#ffffff" stroke="#000000" stroke-width="0.265" stroke-linejoin="bevel">
    <!-- readers -->
    <rect x="24" y="3.2"  width="13.5" height="4.35" rx="1.1" ry="1.1"/>   <!-- Yosys -->
    <rect x="24" y="10.8" width="13.5" height="4.35" rx="1.1" ry="1.1"/>   <!-- slang -->

    <!-- LNAST stack: back sheets are the upass micro-passes -->
    <rect x="51.2" y="12.6" width="19.2" height="6.43"/>
    <rect x="48.6" y="15.8" width="19.2" height="6.43"/>
    <rect x="46"   y="19"   width="19.2" height="6.43"/>

    <!-- LGraph stack: back sheets are the passes iterated in the loop -->
    <rect x="85.2" y="1.6" width="19.2" height="6.43"/>
    <rect x="82.6" y="4.8" width="19.2" height="6.43"/>
    <rect x="80"   y="8"   width="19.2" height="6.43"/>

    <!-- writers -->
    <rect x="112" y="2.3"  width="13.5" height="4.35" rx="1.1" ry="1.1"/>  <!-- cgen -->
    <rect x="112" y="9.5"  width="13.5" height="4.35" rx="1.1" ry="1.1"/>  <!-- sim -->
    <rect x="112" y="16.3" width="13.5" height="4.35" rx="1.1" ry="1.1"/>  <!-- Graphviz -->
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#ffcc00" stroke-width="0.265" marker-end="url(#arrow)">
    <!-- Verilog -> Yosys / slang -->
    <path d="M 16,7.6 L 22.3,5.6"/>
    <path d="M 16,10.5 L 22.3,12.6"/>
    <!-- Yosys -> LGraph (bypasses LNAST) -->
    <path d="M 39,5.375 L 81,5.375"/>
    <!-- slang -> LNAST -->
    <path d="M 39,13.5 L 46,17.2"/>
    <!-- Pyrope -> LNAST -->
    <path d="M 16,23 L 44,23"/>
    <!-- LNAST upass: one sweep, no loop -->
    <path d="M 46.5,26.9 L 63.5,26.9"/>
    <!-- LNAST -> LGraph -->
    <path d="M 71.5,14.5 L 78,11"/>
    <!-- LGraph pass loop (cprop / bitwidth ... iterate) -->
    <path d="M 96,14.43 C 96,18.6 94.5,20.7 89.5,20.7 L 84.5,20.7 C 74.5,20.7 74.8,14.2 78.6,13.5"/>
    <!-- LGraph -> cgen / sim / Graphviz -->
    <path d="M 100.5,9.5  L 110.5,5"/>
    <path d="M 100.5,11.7 L 110.5,11.7"/>
    <path d="M 100.5,13.8 L 110.5,18"/>
    <!-- cgen -> Verilog -->
    <path d="M 126.5,4.475 L 131.5,4.475"/>
    <!-- sim -> C++ / LLVM -->
    <path d="M 126.5,10.6 L 131.5,9.2"/>
    <path d="M 126.5,12.7 L 131.5,14.1"/>
    <!-- LNAST -> Pyrope (prp_writer) -->
    <path d="M 66.5,23 L 131.5,23"/>
  </g>

  <!-- text -->
  <g font-family="'Source Code Pro','Droid Sans Mono',monospace" font-size="3.5" text-anchor="middle">
    <!-- languages (green) -->
    <g fill="#008000">
      <text x="7.5"   y="10">Verilog</text>
      <text x="7.5"   y="24">Pyrope</text>
      <text x="140.5" y="5.5">Verilog</text>
      <text x="140.5" y="9.6">C++</text>
      <text x="140.5" y="15">LLVM</text>
      <text x="140.5" y="24">Pyrope</text>
    </g>
    <!-- tools / passes (blue) -->
    <g fill="#0000ff">
      <text x="30.75"  y="6.6">Yosys</text>
      <text x="30.75"  y="14.2">slang</text>
      <text x="118.75" y="5.7">cgen</text>
      <text x="118.75" y="12.9">sim</text>
      <text x="58.2" y="18.4" font-size="3">upass</text>
      <text x="92.2" y="7.4"  font-size="3">pass</text>
      <text x="94.8" y="4.2"  font-size="2.6">cprop</text>
    </g>
    <!-- IRs and formats (black) -->
    <g fill="#000000">
      <text x="55.6"   y="23.4" font-size="3.9">LNAST</text>
      <text x="89.6"   y="12.5" font-size="4.2">LGraph</text>
      <text x="118.75" y="19.4" font-size="2.8">Graphviz</text>
    </g>
  </g>
</svg>

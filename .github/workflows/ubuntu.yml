name: Ubuntu

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-opt:
    name: Build everything
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7


      - name: Restore bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: "~/.cache/bazel"
          key: bazel-gcc-${{ runner.os }}-${{ hashFiles('.bazelrc', '.bazelversion', 'WORKSPACE*', 'MODULE.bazel') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-gcc-${{ runner.os }}-${{ hashFiles('.bazelrc', '.bazelversion', 'WORKSPACE*', 'MODULE.bazel') }}-
            bazel-gcc-${{ runner.os }}-
            bazel-gcc-

      - name: Show compiler selection
        run: |
          "$CC" --version
          "$CXX" --version

      - run: bazel test -c dbg --test_output=errors //...

      # Preserve completed build actions even when a later build or test fails.
      # Per-run keys let a restored partial cache grow instead of freezing it.
      - name: Save bazel cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: "~/.cache/bazel"
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  coverage:
    name: Gather coverage metrics
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      GCOV: gcov-14  # must match CC, or gcov rejects the .gcda/.gcno data (version 'B42*', prefer 'B33*')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7


      - name: Restore bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: "~/.cache/bazel"
          key: bazel-coverage-${{ runner.os }}-${{ hashFiles('.bazelrc', '.bazelversion', 'WORKSPACE*', 'MODULE.bazel') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-coverage-${{ runner.os }}-${{ hashFiles('.bazelrc', '.bazelversion', 'WORKSPACE*', 'MODULE.bazel') }}-
            bazel-coverage-${{ runner.os }}-
            bazel-coverage-

      - name: Print the list of targets
        run: bazel query --output label_kind //...

      - name: Show compiler selection
        run: |
          "$CC" --version
          "$CXX" --version

      # continue-on-error so partial coverage is still uploaded when some
      # tests fail (the failure is re-raised after the upload below).
      - id: coverage
        continue-on-error: true
        # Match scripts/getcov.sh: run optimized coverage, with debug builds
        # tested separately in the other job.
        # Same instrumentation filter so the dashboard
        # measures the main packages only (no third_party / helper tooling).
        # Keep the long-test and benchmark exclusions from .bazelrc.
        run: bazel coverage -c opt --keep_going --collect_code_coverage --combined_report=lcov --test_output=errors --instrumentation_filter='^//(core|graph|lnast|parser|inou|lhd|lsp|pass|upass|ware|simlib|packages)(/|:)' //...

      - name: Save bazel cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: "~/.cache/bazel"
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - uses: codecov/codecov-action@v7
        with:
          slug: masc-ucsc/livehd
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./bazel-out/_coverage/_coverage_report.dat
          disable_search: true

      - name: Propagate test failures
        if: steps.coverage.outcome == 'failure'
        run: exit 1

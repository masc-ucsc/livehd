name: macOS 26

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-opt:
    name: Optimized regression
    runs-on: macos-26
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/Library/Caches/bazel
          key: bazel-build-${{ runner.os }}-${{ runner.arch }}-clang21-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-build-${{ runner.os }}-${{ runner.arch }}-clang21-${{ github.sha }}-
            bazel-build-${{ runner.os }}-${{ runner.arch }}-clang21-

      - name: Show compiler selection
        run: |
          "$CC" --version
          "$CXX" --version

      - name: Run self-contained regression
        run: bazel test -c opt --test_output=errors //...

      # A full build is expensive and failures tend to happen late. Keep
      # successfully produced Bazel outputs for the next run either way.
      - name: Save Bazel cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-primary-key != '' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/Library/Caches/bazel
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
